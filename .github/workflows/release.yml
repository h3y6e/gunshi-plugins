name: Release

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

permissions: {}

jobs:
  release-env:
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.event.label.name, 'tagpr:') &&
      startsWith(github.head_ref, 'tagpr-from-packages-env-') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: $/.github/workflows/release-package.yml
    with:
      package: env
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: read
      id-token: write

  release-usage:
    if: >-
      github.event_name != 'pull_request' ||
      (startsWith(github.event.label.name, 'tagpr:') &&
      startsWith(github.head_ref, 'tagpr-from-packages-usage-') &&
      github.event.pull_request.head.repo.full_name == github.repository)
    uses: $/.github/workflows/release-package.yml
    with:
      package: usage
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
    permissions:
      contents: read
      id-token: write
